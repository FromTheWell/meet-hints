[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meet-hints"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyaudiowpatch>=0.2.12",
    "faster-whisper>=1.0.0",
    "anthropic>=0.40.0",
    "notion-client>=2.2.1",
    "click>=8.1.7",
    "pydantic-settings>=2.4.0",
    "pydantic>=2.8.0",
    "rich>=13.7.0",
    "keyboard>=0.13.5",
    "numpy>=1.26.0",
]

[project.scripts]
meet-hints = "meet_hints.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["meet_hints*"]
